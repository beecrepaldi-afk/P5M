name: Build APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

# Varios pushes seguidos geram builds concorrentes que publicam todos na mesma
# tag 'dev'. Sem isto, um build antigo pode terminar depois de um novo e deixar
# o APK desatualizado no release. Cancela o anterior e so o mais recente publica.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Versao fixa: o ubuntu-latest passa a ser o Ubuntu 26 a partir de
    # 19/10/2026, e a troca de imagem nao pode acontecer sem a gente saber.
    runs-on: ubuntu-24.04
    env:
      # O ccache reconhece o compilador pela data do arquivo, e o NDK e
      # reinstalado a cada build: o clang chega sempre com data nova, e o
      # placar da dev.234 deu 0 acertos em 416. A versao do NDK, que e o que
      # de fato muda o compilador, passa a ser a identidade dele.
      CCACHE_COMPILERCHECK: string:ndk-26.3.11579264
      # Caminhos relativos a raiz do checkout no hash, por garantia: o runner
      # usa sempre o mesmo, mas uma troca de imagem nao pode zerar o cache.
      CCACHE_BASEDIR: ${{ github.workspace }}
    # Necessario para o passo de release publicar a tag e o APK.
    permissions:
      contents: write
      # Uma issue e o unico lugar onde o texto de uma falha da CI chega ate
      # quem trabalha neste repositorio de fora dele: o log do Actions mora num
      # blob do Azure que a politica de saida daqui recusa, e a API so devolve
      # um redirecionamento para la. Ver o passo "Diagnostico" no fim.
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # Conferencias que custam milissegundos e substituem uma volta inteira de
      # CI -- ou, pior, uma sessao de teste gasta com um APK que nao podia
      # funcionar. Cobrem as tres fronteiras que nenhum compilador atravessa
      # sozinho: JNI, tabelas indexadas por ciclo, e os patches do submodulo.
      # Cada uma delas ja quebrou um build nesta arvore.
      - name: Conferencias rapidas
        run: python3 tools/conferir.py

      # Antes do NDK, de proposito: um erro de C++ aparece aqui em segundos e
      # com arquivo e linha, enquanto no externalNativeBuild ele aparece quinze
      # minutos depois -- e o log de la e inalcancavel de onde este projeto e
      # desenvolvido. E o mesmo teste que roda localmente antes do push.
      - name: Compilacao nativa
        run: python3 tools/compilar_nativo.py

      - name: JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          # O padrao desta action pede "tools platform-tools", e o pacote
          # "tools" saiu do repositorio do SDK: desde 23/09 o sdkmanager sai
          # com erro so por causa dele, e a build morria em 44 s (dev.193). So
          # platform-tools basta: NDK, CMake, plataforma e build-tools o passo
          # seguinte instala explicitamente. Achado no fork pedrinmz/P5M.
          packages: platform-tools

      # Sem cache do SDK: a imagem do runner ja traz parte destes pacotes em
      # pasta do sistema (build-tools 34.0.0, ao menos), e restaurar o cache
      # por cima falhava com "Cannot change mode ... Operation not permitted"
      # -- o que descartava o cache inteiro, NDK junto, em toda build. O
      # sdkmanager abaixo pula o que ja esta instalado e baixa so o que falta.
      - name: NDK e CMake
        run: |
          sdkmanager --install "ndk;26.3.11579264" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"

      # A libchiaki gera os stubs nanopb em tempo de build, o que exige protoc e
      # o gerador Python do nanopb rodando no HOST -- nao no alvo Android.
      # O pip nao pode mais escrever no Python do sistema sem dizer que sabe.
      #
      # Imagem de runner nova, PEP 668: o Python do sistema vem marcado como
      # gerenciado externamente, e `pip install` sem `--break-system-packages`
      # sai na hora com `externally-managed-environment`. O build 165 passou
      # aqui em 04/09 e o 166 falhou em 09/09 sem que nada deste passo mudasse,
      # e o passo inteiro morreu em sete segundos -- que e o tempo de um
      # `apt-get update` seguido de um pip que nem tentou.
      #
      # A tentativa sem a bandeira vem primeiro de proposito: onde ela nao e
      # necessaria, nada muda, e onde e, a segunda linha resolve. Assim o passo
      # deixa de depender de qual imagem o `ubuntu-latest` aponta hoje.
      - name: protoc e gerador nanopb
        run: |
          set -x
          # Tudo tambem para um arquivo: se este passo cair, e este texto que o
          # passo de diagnostico publica.
          exec > >(tee -a "$RUNNER_TEMP/protoc.log") 2>&1
          # `update` que falha nao e motivo para parar: o indice que veio na
          # imagem costuma bastar para os dois pacotes abaixo, e insistir aqui
          # ja derrubou builds por um espelho fora do ar.
          sudo apt-get update || echo "apt-get update falhou; seguindo com o indice da imagem"
          sudo apt-get install -y protobuf-compiler ccache \
            || (sleep 10 && sudo apt-get install -y protobuf-compiler ccache)
          python3 -m pip install --upgrade "protobuf<6" \
            || python3 -m pip install --upgrade --break-system-packages "protobuf<6"
          protoc --version

      # Publica o motivo da falha onde de para ler de fora.
      #
      # Existe porque o log do Actions e servido por um host que a rede daqui
      # nao alcanca, e sem ele a alternativa e adivinhar de build em build --
      # que ja custou duas. Sai junto com o passo assim que a causa for
      # entendida; nao e para ficar.
      - name: Diagnostico da falha
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Build ${GITHUB_RUN_NUMBER}, commit ${GITHUB_SHA}"
            echo
            echo '```'
            tail -n 120 "$RUNNER_TEMP/protoc.log" 2>/dev/null || echo "(sem log)"
            echo '```'
          } > "$RUNNER_TEMP/corpo.md"
          gh issue create --title "CI ${GITHUB_RUN_NUMBER}: falha no passo do protoc" \
            --body-file "$RUNNER_TEMP/corpo.md" || true

      # Tag v1.2.3 vira a versao 1.2.3 e um release definitivo. Push em branch
      # vira 0.1.0-dev.<build> e atualiza o release rolante 'dev'.
      #
      # O versionCode e o numero do build em ambos os casos: monotonico, entao
      # dá para alternar entre uma versao marcada e um build de desenvolvimento
      # sem o Android recusar a instalacao por downgrade.
      - name: Determinar versao
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "tagged=true" >> "$GITHUB_OUTPUT"
          else
            BASE=$(grep '^p5mVersionName=' gradle.properties | cut -d= -f2)
            VERSION="${BASE}-dev.${GITHUB_RUN_NUMBER}"
            echo "tagged=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "P5M_VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "P5M_VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "Versao: $VERSION (code $GITHUB_RUN_NUMBER)"

      # A libchiaki, o OpenSSL, o json-c e o curl sao a maior parte do que se
      # compila aqui e mudam quase nunca -- o que muda a cada push sao meia
      # duzia de linhas nossas. O ccache reconhece isso pelo conteudo, e nao
      # pela data, entao atravessa ate uma arvore recriada do zero.
      - name: Cache do ccache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-${{ github.run_number }}
          restore-keys: ccache-

      # Zera o placar antes da build, para o passo "Placar do ccache" contar
      # so esta. Sem placar nao da para saber se o cache acerta: a compilacao
      # nativa e o caminho critico da build (uns 2 min de 3,5 na dev.232).
      - name: Zerar o placar do ccache
        run: ccache -z

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # Intermediarios de CA que os servidores da Sony nao mandam.
      #
      # O host de notificacoes manda so a folha, sem a autoridade que a
      # assinou. O OpenSSL nao busca o que falta (a extensao AIA nunca foi
      # implementada no curl -- curl#2793), entao a conexao remota morre no
      # aperto de mao. O mesmo defeito esta aberto no chiaki-ng upstream
      # (#798), atingindo Linux de mesa: e a Sony que mudou o servidor.
      #
      # Baixar aqui e nao no aparelho tira a dependencia de a rede onde o
      # headset esta alcancar o CDN da autoridade -- e justamente longe de casa
      # que isso e menos garantido. Baixado a cada build, entao nao envelhece
      # como envelheceria um arquivo versionado.
      #
      # O que sai daqui e um CANDIDATO, nao um certificado confiado: o
      # CaBundle refaz a prova no aparelho, contra as raizes daquele aparelho,
      # antes de usar. A conferencia abaixo e so para nao embarcar lixo.
      #
      # Nunca derruba o build: se a CI nao baixar, o app ainda tenta pela AIA
      # em tempo de execucao.
      - name: Intermediarios de CA
        continue-on-error: true
        run: |
          set -u
          destino=app/src/main/assets/ca-intermediarios.pem
          mkdir -p "$(dirname "$destino")"
          : > "$destino"
          for url in \
            http://crt.comodoca.com/COMODORSADomainValidationSecureServerCA.crt \
            http://crt.sectigo.com/COMODORSADomainValidationSecureServerCA.crt
          do
            echo "Tentando $url"
            curl -fsS --max-time 30 -o bruto.crt "$url" || continue
            # O CDN entrega DER; PEM tambem e aceito, por seguranca.
            openssl x509 -inform DER -in bruto.crt -out cand.pem 2>/dev/null \
              || openssl x509 -in bruto.crt -out cand.pem 2>/dev/null \
              || { echo "nao e um certificado X.509"; continue; }
            if openssl verify -CAfile /etc/ssl/certs/ca-certificates.crt cand.pem; then
              openssl x509 -in cand.pem -noout -subject -issuer -enddate
              cat cand.pem >> "$destino"
              break
            else
              echo "::warning::o certificado de $url nao valida contra as raizes do runner"
            fi
          done
          if [ -s "$destino" ]; then
            echo "Intermediario embarcado ($(wc -c < "$destino") bytes)."
          else
            echo "::warning::Nenhum intermediario embarcado. O app vai depender de"
            echo "::warning::buscar pela AIA em tempo de execucao."
          fi

      # A chave que assina o APK, guardada entre builds.
      #
      # Sem isto o Gradle gera um ~/.android/debug.keystore novo em cada runner,
      # porque o runner e descartavel. Assinaturas diferentes fazem o Android
      # recusar instalar por cima: para trocar de versao e preciso desinstalar,
      # e desinstalar leva junto TODO o estado do app -- login da PSN, registro
      # do console, modo de exibicao, nitidez. Cada APK novo chegava como um
      # aplicativo diferente que por acaso tem o mesmo nome.
      #
      # A chave vem do secret P5M_DEBUG_KEYSTORE_BASE64 (copia em
      # ~/projetos/PSMeta-docs/p5m-debug.keystore, fora do repositorio:
      # material de assinatura nao se versiona). Ate a dev.244 ela vivia so no
      # cache do Actions, que o GitHub apaga depois de 7 dias sem uso: um mes
      # sem push (14/10 a 18/11) levou a chave e obrigou a desinstalar. O cache
      # continua como reserva para um fork sem o secret.
      - name: Chave de assinatura do secret
        env:
          P5M_DEBUG_KEYSTORE_BASE64: ${{ secrets.P5M_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$P5M_DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$P5M_DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            echo "P5M_DEBUG_FROM_SECRET=1" >> "$GITHUB_ENV"
          fi

      - name: Chave de assinatura estavel (reserva)
        if: env.P5M_DEBUG_FROM_SECRET != '1'
        uses: actions/cache@v6
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Conferir a chave
        run: |
          if [ "$P5M_DEBUG_FROM_SECRET" = "1" ]; then
            echo "Chave fixa do secret; este APK instala por cima do anterior."
          elif [ -f ~/.android/debug.keystore ]; then
            echo "Chave restaurada do cache; este APK instala por cima do anterior."
          else
            echo "::warning::Sem chave no cache. O Gradle vai criar uma nova, e este"
            echo "::warning::APK NAO instala por cima: sera preciso desinstalar uma vez."
          fi

      # Tag v* sai em release, assinado com a chave de publicacao; push de
      # branch continua em debug, com a chave do cache, para o dev rolante
      # instalar por cima do anterior como sempre.
      #
      # As duas chaves sao diferentes de proposito, e isso tem custo: trocar
      # entre o dev e uma versao marcada pede desinstalar uma vez. Sem o secret
      # a tag falha em vez de publicar um APK de debug como se fosse release.
      - name: Chave de publicacao
        if: steps.version.outputs.tagged == 'true'
        env:
          P5M_KEYSTORE_BASE64: ${{ secrets.P5M_KEYSTORE_BASE64 }}
          P5M_KEYSTORE_PASSWORD: ${{ secrets.P5M_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$P5M_KEYSTORE_BASE64" ] || [ -z "$P5M_KEYSTORE_PASSWORD" ]; then
            echo "::error::Tag sem os secrets P5M_KEYSTORE_BASE64 e P5M_KEYSTORE_PASSWORD."
            exit 1
          fi
          echo "$P5M_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/p5m-release.p12"
          echo "P5M_KEYSTORE=$RUNNER_TEMP/p5m-release.p12" >> "$GITHUB_ENV"
          echo "P5M_KEYSTORE_PASSWORD=$P5M_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Build APK
        id: apk
        run: |
          if [ "${{ steps.version.outputs.tagged }}" = "true" ]; then
            ./gradlew --no-daemon assembleRelease
            echo "path=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
          else
            ./gradlew --no-daemon assembleDebug
            echo "path=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
          fi

      - name: Placar do ccache
        if: always()
        run: ccache -s -v || true

      - name: Apagar a chave de publicacao
        if: always() && steps.version.outputs.tagged == 'true'
        run: rm -f "$RUNNER_TEMP/p5m-release.p12"

      # Sem artefato do Actions: o APK que vale e o do release, e a copia de
      # conveniencia enchia a cota de armazenamento do repositorio privado
      # (24/09 e de novo 29/09, na dev.229), mesmo expirando em 3 dias.

      # Release rolante: uma unica tag 'dev' que sempre aponta para o build mais
      # recente. Assim o APK tem URL fixa e baixa direto, sem zip e sem precisar
      # achar o run certo no Actions.
      - name: Preparar APK
        run: |
          cp "${{ steps.apk.outputs.path }}" p5m.apk
          cp "${{ steps.apk.outputs.path }}" "p5m-${{ steps.version.outputs.version }}.apk"
          ls -lh p5m*.apk

      # Release definitivo, so em tag. Fica na lista de releases para sempre,
      # com o APK daquela versao exata anexado.
      #
      # Sem generate_release_notes: ele lista os titulos dos commits, que sao em
      # portugues por contrato. A pagina de releases e a primeira coisa que
      # alguem de fora le, e ela e em ingles.
      - name: Publicar release versionado
        if: steps.version.outputs.tagged == 'true'
        uses: softprops/action-gh-release@v3
        with:
          name: P5M ${{ steps.version.outputs.version }}
          files: p5m-${{ steps.version.outputs.version }}.apk
          fail_on_unmatched_files: true
          body: |
            P5M **${{ steps.version.outputs.version }}**, a tagged release.

            ## Installing

            Open this page in the Quest browser and install
            `p5m-${{ steps.version.outputs.version }}.apk`. No PC needed. From a
            PC: `adb install -r p5m-${{ steps.version.outputs.version }}.apk`.

            It shows up in your library under **Unknown Sources**, as "P5M".

            Coming from a `dev` build? Uninstall it first. Tagged releases are
            signed with a different key, and Android refuses to install one
            over the other. You will need to sign in to PSN again.

            ## Before you start

            **Pair your controller with the headset, not with the console.** A
            DualSense paired to your PS5 is invisible to the Quest, so the app
            gets no input and looks broken.

            While you play, **L3 + R3 + R1** opens the settings panel. The same
            chord closes it, and the launcher can change it.

            ## When something goes wrong

            Open the app and hit **Report a problem**.

            ## Supporting it

            P5M is free and the source is open. If you want to keep it moving:
            <https://patreon.com/gblandro>

      # O release rolante acumularia um APK versionado por push. Limpa os
      # antigos antes de anexar o novo, para a pagina ficar com exatamente dois
      # arquivos: o de nome fixo e o da versao atual.
      - name: Limpar APKs versionados antigos do release rolante
        if: steps.version.outputs.tagged == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer $GH_TOKEN")
          ids=$(curl -sS "${auth[@]}" "$api/releases/tags/dev" \
            | jq -r '.assets[]? | select(.name | test("^p5m-.*[.]apk$")) | .id' \
            2>/dev/null || true)
          for id in $ids; do
            echo "Removendo asset antigo $id"
            curl -sS -X DELETE "${auth[@]}" "$api/releases/assets/$id" || true
          done

      # Release rolante, so em branch. Sempre o build mais recente, URL fixa.
      - name: Publicar release rolante
        if: steps.version.outputs.tagged == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: dev
          name: Latest build
          prerelease: true
          files: |
            p5m.apk
            p5m-${{ steps.version.outputs.version }}.apk
          fail_on_unmatched_files: true
          body: |
            This is the newest development build, **${{ steps.version.outputs.version }}**.
            It is rebuilt on every push, so it moves fast and it can break.

            Built from commit ${{ github.sha }}.

            ## Installing

            Open this page in the Quest browser and install the download. No PC
            needed. Both files below are the same build:

            - `p5m.apk` keeps the same name and the same link forever, so you
              can bookmark it.
            - `p5m-${{ steps.version.outputs.version }}.apk` carries the version
              in the name, which helps when you have a few of them sitting in
              your downloads folder.

            From a PC, if you have one handy:

            ```
            adb install -r p5m.apk
            ```

            It shows up in your library under **Unknown Sources**, as "P5M".

            ## Before you start

            **Pair your controller with the headset, not with the console.** A
            DualSense that is paired to your PS5 is invisible to the Quest, so
            the app gets no input at all and looks broken. Put the pad in
            pairing mode and add it from the Quest Bluetooth settings.

            While you play, **L3 + R3 + R1** opens the settings panel: screen
            size, distance, sharpness, passthrough, 3D. The same chord closes
            it, and you can change the chord in the launcher.

            ## When something goes wrong

            Open the app and hit **Report a problem**. It packs up what
            happened and opens a pre-filled issue in the browser. Say what you
            were doing and send it. That is by far the most useful thing you
            can do for this project.

            ## Supporting it

            P5M is free and the source is open. If you want to keep it moving:
            <https://patreon.com/gblandro>
