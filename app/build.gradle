apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-parcelize'
apply plugin: 'kotlin-kapt'

def chiakiNg = file("$rootDir/external/chiaki-ng")
if (!file("$chiakiNg/CMakeLists.txt").exists()) {
    throw new GradleException("Submodulo chiaki-ng ausente. Rode: git submodule update --init --recursive")
}
def chiakiAndroidJava = file("$chiakiNg/android/app/src/main/java")
def chiakiAndroidRes = file("$chiakiNg/android/app/src/main/res")

def p5mVersionCode = (System.getenv("P5M_VERSION_CODE") ?: "1").toInteger()
def p5mVersionName = System.getenv("P5M_VERSION_NAME")
        ?: "${project.findProperty('p5mVersionName') ?: '0.1.0'}-local"

// O submodulo fica intocado no git. Algumas mudancas, porem, so podem ser feitas
// por dentro dele: as chaves de baixa latencia moram no C do decodificador, e o
// redirecionamento da MainActivity para a activity imersiva e uma linha do
// Kotlin dele. Aplicamos os patches antes de qualquer compilacao.
//
// Os patches se aplicam em serie, cada um sobre o resultado do anterior, e
// varios tocam o mesmo arquivo -- entao nao da para perguntar a cada um, em
// separado, se "ja esta aplicado" (o --reverse --check de um patch falha
// quando um posterior mexeu nas mesmas linhas). Em vez disso, depois de
// aplicar a serie inteira gravamos um carimbo com o hash dela e o hash do
// estado resultante do submodulo. Os dois batendo: nada a fazer. Qualquer
// outro caso (build anterior que parou no meio, patch novo vindo do git,
// submodulo mexido a mao, `gradlew clean`) volta o
// submodulo ao commit fixado -- inclusive apagando arquivos que patches
// criaram -- e reaplica tudo.
def applyChiakiPatches = tasks.register('applyChiakiPatches') {
    doLast {
        def patchDir = file("$rootDir/patches")
        if (!patchDir.exists()) return
        def patches = patchDir.listFiles().findAll { it.name.endsWith('.patch') }.sort()

        def digest = java.security.MessageDigest.getInstance('SHA-256')
        patches.each { digest.update(it.name.bytes); digest.update(it.bytes) }
        def serie = digest.digest().encodeHex().toString()
        def carimbo = file("$buildDir/chiaki-patches.sha256")

        def git = { List<String> args ->
            def saida = providers.exec {
                commandLine(['git', '-C', chiakiNg.absolutePath] + args)
                ignoreExitValue = true
            }
            [codigo: saida.result.get().exitValue,
             texto : saida.standardOutput.asText.get() + saida.standardError.asText.get()]
        }

        // Diff dos arquivos versionados + conteudo dos arquivos novos que os
        // patches criaram: muda se qualquer parte da serie faltar ou sobrar.
        def estadoDoSubmodulo = {
            def d = java.security.MessageDigest.getInstance('SHA-256')
            d.update(git(['diff', 'HEAD', '--binary', '--ignore-submodules=all']).texto.bytes)
            git(['ls-files', '--others', '--exclude-standard']).texto.readLines().findAll { it }.sort().each {
                d.update(it.bytes); d.update(file("$chiakiNg/$it").bytes)
            }
            d.digest().encodeHex().toString()
        }

        def alterado = git(['status', '--porcelain', '--ignore-submodules=all']).texto.trim()
        if (alterado && carimbo.exists() && carimbo.text.trim() == "$serie ${estadoDoSubmodulo()}") {
            logger.lifecycle("Patches do chiaki-ng ja aplicados (${patches.size()}, serie ${serie.take(12)})")
            return
        }

        carimbo.delete()
        if (alterado) {
            logger.lifecycle("Submodulo chiaki-ng alterado sem carimbo valido (build anterior interrompida ou patches novos): voltando ao commit fixado")
            [['checkout', '--', '.'], ['clean', '-fdq']].each { args ->
                def r = git(args)
                if (r.codigo != 0) {
                    throw new GradleException("Nao consegui limpar o submodulo chiaki-ng (git ${args.join(' ')}): ${r.texto.trim()}")
                }
            }
        }

        patches.each { patch ->
            def r = git(['apply', patch.absolutePath])
            if (r.codigo != 0) {
                throw new GradleException("Falha ao aplicar ${patch.name} sobre o chiaki-ng limpo mais os patches anteriores -- o patch nao casa com a arvore: ${r.texto.trim()}")
            }
        }
        carimbo.parentFile.mkdirs()
        carimbo.text = "$serie ${estadoDoSubmodulo()}"
        logger.lifecycle("Patches aplicados no chiaki-ng: ${patches.size()} (serie ${serie.take(12)})")
    }
}

android {
    namespace 'com.metallic.chiaki'
    compileSdkVersion 34
    ndkVersion '26.3.11579264'

    defaultConfig {
        applicationId "io.github.gblandro.p5m"
        // Quest 3 roda Android 12L (API 32). minSdk 30 libera
        // MediaCodec KEY_LOW_LATENCY, que e central para este projeto.
        minSdkVersion 30
        targetSdkVersion 34
        // versionCode e sempre o numero do build do CI: monotonico entre
        // builds de branch e de tag, entao dá para ir e voltar entre uma
        // versao marcada e um build de desenvolvimento sem o Android recusar
        // a instalacao. O nome semantico vive no versionName.
        versionCode p5mVersionCode
        versionName p5mVersionName

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                // Reaproveita objetos identicos entre builds. Na CI o cache do
                // ccache atravessa execucoes, e quase toda build daqui muda
                // meia duzia de linhas nossas e nada da libchiaki, do OpenSSL
                // ou do curl -- que sao a maior parte do que se compila. Sem
                // ccache instalado, o CMake ignora estas duas linhas.
                arguments "-DCMAKE_C_COMPILER_LAUNCHER=ccache",
                        "-DCMAKE_CXX_COMPILER_LAUNCHER=ccache",
                        "-DCHIAKI_ENABLE_TESTS=OFF",
                        "-DCHIAKI_ENABLE_CLI=OFF",
                        "-DCHIAKI_ENABLE_GUI=OFF",
                        "-DCHIAKI_ENABLE_SETSU=OFF",
                        "-DCHIAKI_ENABLE_ANDROID=ON",
                        "-DCHIAKI_ENABLE_FFMPEG_DECODER=OFF",
                        "-DCHIAKI_ENABLE_PI_DECODER=OFF",
                        "-DCHIAKI_LIB_ENABLE_OPUS=ON",
                        "-DCHIAKI_LIB_OPENSSL_EXTERNAL_PROJECT=ON",
                        "-DCHIAKI_LIB_JSONC_EXTERNAL_PROJECT=ON",
                        "-DCHIAKI_LIB_MINIUPNPC_EXTERNAL_PROJECT=ON",
                        // O curl embarcado nasce sem nenhuma raiz em que
                        // confiar: o CMakeLists dele so procura um pacote de
                        // certificados quando NAO esta compilando cruzado, e
                        // compilar para Android e exatamente isso. O resultado
                        // era toda conexao HTTPS da libchiaki recusada no aperto
                        // de mao -- que foi como a primeira listagem de consoles
                        // da PSN morreu.
                        //
                        // Este e um macro de compilacao, nao variavel de
                        // ambiente, entao o caminho tem de ser decidido aqui. O
                        // arquivo em si e escrito em tempo de execucao a partir
                        // da loja de confianca do proprio Android; ver
                        // CaBundle.kt, que confere que os dois caminhos batem.
                        "-DCURL_CA_BUNDLE=/data/user/0/io.github.gblandro.p5m/files/p5m-ca.pem",
                        "-DCHIAKI_ENABLE_STEAM_SHORTCUT=OFF",
                        "-DCHIAKI_ENABLE_STEAMDECK_NATIVE=OFF",
                        "-DANDROID_STL=c++_shared"
                cppFlags "-std=c++17"
            }
        }
    }

    externalNativeBuild {
        cmake {
            version "3.22.1"
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    sourceSets {
        main {
            java.srcDirs = ['src/main/java', chiakiAndroidJava]
            // O nosso res so tem arquivos de nome exclusivo; recurso duplicado
            // entre as duas pastas seria erro de fusao.
            res.srcDirs = ['src/main/res', chiakiAndroidRes]
        }
    }

    buildFeatures {
        viewBinding true
        prefab true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = "1.8"
    }

    // A chave de release vem da CI, e so nas tags v*: o workflow decodifica o
    // secret num arquivo e aponta estas variaveis para ele. Sem elas (build
    // local, ou push de branch) o release cai na chave de depuracao, como
    // sempre foi -- nao ha como assinar sem a chave, e nao vale quebrar o
    // build local por isso.
    def chaveRelease = System.getenv("P5M_KEYSTORE")
    signingConfigs {
        if(chaveRelease) {
            release {
                storeFile file(chaveRelease)
                storeType "pkcs12"
                storePassword System.getenv("P5M_KEYSTORE_PASSWORD")
                keyAlias System.getenv("P5M_KEY_ALIAS") ?: "p5m"
                keyPassword System.getenv("P5M_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            // APK de uso pessoal: sem minify, para o stacktrace vir legivel.
            minifyEnabled false
            // O nativo otimizado tambem aqui. O tipo Debug do CMake nao passa
            // -O nenhum, e o APK de todo dia -- o dev, que e o que se joga e o
            // que se mede -- rodava a libchiaki inteira (rede, FEC, montagem
            // de quadro), o Opus do microfone e o espacializador em -O0. So as
            // tags saiam otimizadas. -O2 pela flag, e nao trocando o tipo para
            // RelWithDebInfo: aquele traz -DNDEBUG, que desliga os assert da
            // libchiaki, e eles pegam defeito cedo. Os simbolos (-g) ficam.
            externalNativeBuild {
                cmake {
                    cFlags "-O2"
                    cppFlags "-O2"
                }
            }
        }
        release {
            // Sem minify tambem aqui: o lado nativo acha classes e metodos
            // Kotlin por nome, pelo JNI, e o R8 renomearia o que ele procura.
            minifyEnabled false
            signingConfig chaveRelease ? signingConfigs.release : signingConfigs.debug
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging false
        }
    }
    // O modelo da profundidade neural e mapeado direto do APK pelo LiteRT,
    // e mapear exige o asset sem compressao.
    androidResources {
        noCompress 'tflite'
    }
    lint {
        abortOnError false
    }
}

// Compilamos as fontes Kotlin do submodulo direto do diretorio dele, ja
// patcheadas -- por isso toda task que le codigo precisa esperar o patch.
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    dependsOn applyChiakiPatches
    kotlinOptions {
        freeCompilerArgs += "-opt-in=kotlin.ExperimentalUnsignedTypes"
    }
}
tasks.matching { it.name.startsWith('kapt') }.configureEach {
    dependsOn applyChiakiPatches
}
preBuild.dependsOn applyChiakiPatches
// O CMake do submodulo compila o C que o patch altera, entao as tasks nativas
// tambem precisam esperar por ele -- preBuild sozinho nao garante a ordem em
// todas as versoes do AGP.
tasks.matching {
    it.name.startsWith('configureCMake') ||
    it.name.startsWith('buildCMake') ||
    it.name.startsWith('externalNativeBuild')
}.configureEach {
    dependsOn applyChiakiPatches
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'androidx.appcompat:appcompat:1.6.0'
    // VrStreamActivity, LauncherActivity e DiagnosticActivity nao usam AppCompat:
    // o AppCompat exige tema Theme.AppCompat para setContentView, e elas usam
    // temas do sistema. ComponentActivity da o LifecycleOwner sem essa amarra.
    implementation 'androidx.activity:activity-ktx:1.6.1'
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'androidx.preference:preference:1.2.0'
    implementation 'com.google.android.material:material:1.8.0'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.5.1'
    implementation 'androidx.lifecycle:lifecycle-reactivestreams:2.5.1'
    implementation "io.reactivex.rxjava2:rxjava:2.2.20"
    implementation "io.reactivex.rxjava2:rxkotlin:2.4.0"
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'
    def room_version = "2.5.0"
    implementation "androidx.room:room-runtime:$room_version"
    kapt "androidx.room:room-compiler:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    implementation "androidx.room:room-rxjava2:$room_version"
    implementation "com.squareup.moshi:moshi:1.14.0"
    kapt "com.squareup.moshi:moshi-kotlin-codegen:1.14.0"

    // Audio do chiaki-jni.
    implementation "com.google.oboe:oboe:1.9.3"
    // Loader OpenXR oficial do Khronos, com headers via prefab.
    implementation "org.khronos.openxr:openxr_loader_for_android:1.1.65"

    // Alcanca BluetoothHidHost, que e @SystemApi e esta na lista de bloqueio
    // de API escondida. A isencao instalada em DualSenseHid nomeia tres
    // classes, e nao abre a lista inteira.
    implementation "org.lsposed.hiddenapibypass:hiddenapibypass:6.1"

    // LiteRT (o TensorFlow Lite renomeado) e o delegate de GPU, Apache 2.0:
    // rodam o ZipDepth da profundidade neural do 3D emulado.
    implementation 'com.google.ai.edge.litert:litert:1.4.2'
    implementation 'com.google.ai.edge.litert:litert-gpu:1.4.2'
}
